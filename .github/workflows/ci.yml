# scripts/check.sh, with the simulation's fixed seeds, the fuzz targets' build and mutation testing of
# what changed in jobs of their own. Random seeds and fuzzing run nightly (simulate.yml, fuzz.yml).
name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --exact --skip simulate
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The simulation's fixed seeds (crates/turbofan/tests/sim.rs), a release build: a failure
  # prints SIM_SEED=<n>, which replays it.
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p turbofan --release --test sim

  # The fuzz targets (crates/turbofan/fuzz) still build against the current API. They're
  # outside the workspace, so the check job doesn't see them; fuzzing itself runs nightly (fuzz.yml).
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/turbofan/fuzz
      - run: cargo fmt --manifest-path crates/turbofan/fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/turbofan/fuzz/Cargo.toml --bins --locked -- -D warnings

  # Mutation testing of what the push or pull request changed (scripts/mutants.sh). A mutant the
  # tests miss is a warning on its line, not a failure: some can't be caught, being the same as
  # the code. Fails only if the tests or the build fail unmutated.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch's first push has nothing before it: its last commit, then.
          if [[ -z $BASE || $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=HEAD~1
          fi
          status=0
          scripts/mutants.sh "$BASE" || status=$?
          # 2: some missed; 3: some timed out, which counts as caught.
          if [[ $status != 0 && $status != 2 && $status != 3 ]]; then
            exit "$status"
          fi
          missed=0
          if [[ -f mutants.out/missed.txt ]]; then
            while IFS= read -r line; do
              location=${line%%: *}
              file=${location%%:*} rest=${location#*:}
              echo "::warning file=$file,line=${rest%%:*}::The tests miss this mutant: ${line#*: }"
              missed=$((missed + 1))
            done <mutants.out/missed.txt
          fi
          caught=$(grep -c '' mutants.out/caught.txt 2>/dev/null || echo 0)
          echo "Mutants of what changed since \`${BASE:0:12}\`: $caught caught, $missed missed." >>"$GITHUB_STEP_SUMMARY"

  # The cluster's throughput and latency, into the run's summary, compared with main's last run's,
  # which the cache keeps: a run well below it is flagged with a warning. See benches/cluster.rs.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The latest saved: main's, which a pull request's run can read too.
      - uses: actions/cache/restore@v6
        with:
          path: bench-main.tsv
          key: bench-main-${{ github.run_id }}
          restore-keys: bench-main-
      # Absolute paths: cargo runs the bench in the crate's directory. To the log too, so what ran
      # before a failure shows; `shell: bash` sets pipefail, so a failure still fails the step.
      - run: cargo bench -p turbofan --bench cluster --features tls | tee bench.md
        shell: bash
        env:
          BENCH_BASELINE: ${{ github.workspace }}/bench-main.tsv
          BENCH_RESULTS: ${{ github.workspace }}/bench-new.tsv
      # The table to the summary; the warnings to the log, where they're annotations.
      - run: |
          grep -v '^::' bench.md >> "$GITHUB_STEP_SUMMARY"
          grep '^::' bench.md || true
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: mv bench-new.tsv bench-main.tsv
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: bench-main.tsv
          key: bench-main-${{ github.run_id }}
