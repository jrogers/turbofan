# scripts/check.sh, less the fuzz build and the simulation test.
name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --exact --skip simulate
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The cluster's throughput and latency, into the run's summary, compared with main's last run's,
  # which the cache keeps: a run well below it is flagged with a warning. See benches/cluster.rs.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The latest saved: main's, which a pull request's run can read too.
      - uses: actions/cache/restore@v6
        with:
          path: bench-main.tsv
          key: bench-main-${{ github.run_id }}
          restore-keys: bench-main-
      - run: cargo bench -p turbofan-cluster --bench cluster --features tls > bench.md
        env:
          BENCH_BASELINE: bench-main.tsv
          BENCH_RESULTS: bench-new.tsv
      # The table to the summary; the warnings to the log, where they're annotations.
      - run: |
          grep -v '^::' bench.md >> "$GITHUB_STEP_SUMMARY"
          grep '^::' bench.md || true
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: mv bench-new.tsv bench-main.tsv
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: bench-main.tsv
          key: bench-main-${{ github.run_id }}
