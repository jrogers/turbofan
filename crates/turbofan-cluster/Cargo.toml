[package]
name = "turbofan-cluster"
description = "A Raft-replicated state machine framework: a deterministic service, client sessions, timers and snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
crc32c.workspace = true
metrics.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
turbofan-sbe.workspace = true

[features]
# TLS on the listeners and to peers (`tls`): rustls on ring, whose licences (ISC, BSD-3-Clause)
# a service that doesn't use it needn't take on. Without it, plain TCP, and TLS configuration is
# refused when it's loaded.
tls = ["dep:tokio-rustls"]

[build-dependencies]
turbofan-sbe.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "cluster"
harness = false
