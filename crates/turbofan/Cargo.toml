[package]
name = "turbofan"
description = "A Raft-replicated state machine framework: a deterministic service, client sessions, timers and snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["raft", "replication", "consensus", "state-machine", "distributed"]
categories = ["network-programming", "database-implementations", "asynchronous"]
# The fuzz targets build only with cargo fuzz, outside the workspace.
exclude = ["fuzz"]

# Document every feature on docs.rs, so the TLS configuration appears.
[package.metadata.docs.rs]
all-features = true

[dependencies]
crc32c.workspace = true
metrics.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
turbofan-sbe.workspace = true

[features]
# TLS on the listeners and to peers (`tls`): rustls on ring, whose licences (ISC, BSD-3-Clause)
# a service that doesn't use it needn't take on. Without it, plain TCP, and TLS configuration is
# refused when it's loaded.
tls = ["dep:tokio-rustls"]
# A cluster in memory, for a service's tests (`testing`): its nodes in one process, deterministic,
# on a clock the test moves. For a service's dev-dependencies; its API may change before 1.0.
testing = []

[build-dependencies]
turbofan-sbe.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "cluster"
harness = false
