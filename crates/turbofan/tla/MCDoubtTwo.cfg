\* Doubt, two nodes in it at once: five voters, two torn crashes. Only from five voters does
\* each doubter's vote add one more: with three, one doubter already needs every vote. Not yet
\* run to the end: clean through depth 22 in 8.5 hours on 12 cores (419M states, 74 GB on
\* disk), each depth about doubling it. With one vote more for any doubt, not one each, it
\* fails at depth 26, out of its reach; MCDoubtTwoTrace takes that run, step by step.
CONSTANTS
    Server = {s1, s2, s3, s4, s5}
    Initial = {s1, s2, s3, s4, s5}
    MaxTerm = 2
    MaxLog = 1
    MaxCrashes = 0
    MaxTorn = 2
    MaxChanges = 0
    Nil = Nil
    MaxMsgs = 5
SPECIFICATION Spec
CONSTRAINT Bounded
SYMMETRY Symmetry
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    NoCommittedTruncated
    CommitsAreCommitted
