\* Doubt: three voters, a torn crash on any of them, no changes of members. Exhaustive in about
\* 7 hours on 8 cores (766M states, depth 46); without the doubt rule, it fails in seconds.
CONSTANTS
    Server = {s1, s2, s3}
    Initial = {s1, s2, s3}
    MaxTerm = 2
    MaxLog = 1
    MaxCrashes = 0
    MaxTorn = 1
    MaxChanges = 0
    Nil = Nil
    MaxMsgs = 4
SPECIFICATION Spec
CONSTRAINT Bounded
SYMMETRY Symmetry
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    NoCommittedTruncated
    CommitsAreCommitted
