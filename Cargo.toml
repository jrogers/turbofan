[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jrogers/turbofan"
rust-version = "1.89"

[workspace.lints.rust]
# Deny rather than forbid, so a reviewed exception can `#[allow]` it locally with a reason.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
missing_errors_doc = "warn"
too_many_lines = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"

[workspace.dependencies]
turbofan = { path = "crates/turbofan", version = "0.10.0" }
# The SBE runtime the generated codecs call, and the generator their build.rs runs.
turbofan-sbe = { path = "crates/turbofan-sbe", version = "0.10.0" }
roxmltree = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tempfile = "3"
# Log record and snapshot checksums, in hardware where the CPU has it.
crc32c = "0.6"
# What a node counts, for whichever recorder the binary installs.
metrics = "0.24"
# Keepalive and TCP_USER_TIMEOUT, which tokio's TcpStream doesn't set: already tokio's own.
socket2 = { version = "0.6", features = ["all"] }
# TLS, optional, on all three listeners: rustls on ring, so no C toolchain beyond a compiler.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Certificates for the TLS tests.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

# The simulator runs hundreds of thousands of events per seed: optimised, with debug assertions
# and overflow checks still on.
[profile.test]
opt-level = 2

# The benchmark and examples/echo.rs: 10 to 18% more throughput than thin local LTO and 16 units, for
# a slower build. A service sets its own: a dependency's profiles don't apply to it.
[profile.release]
lto = "fat"
codegen-units = 1
