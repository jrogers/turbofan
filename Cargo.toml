[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.lints.rust]
# Deny rather than forbid, so a reviewed exception can `#[allow]` it locally with a reason.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
missing_errors_doc = "warn"
too_many_lines = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"

[workspace.dependencies]
turbofan = { path = "crates/turbofan" }
# The SBE runtime the generated codecs call, and the generator their build.rs runs.
turbojet = { version = "0.8", default-features = false }
turbojet-codegen = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tempfile = "3"

# The simulator runs hundreds of thousands of events per seed: optimised, with debug assertions
# and overflow checks still on.
[profile.test]
opt-level = 2
